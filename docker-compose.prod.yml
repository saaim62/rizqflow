# RizqFlow production service — runs beside DropRoute on the same host.
# Joins DropRoute's network so its Caddy can reverse-proxy rizqflow-web:3000.
#
# HOST NOTE (2 GB EC2): a full in-Docker `next build` OOM-killed dockerd
# on this box (21 Nov 2026, NOTES #19). The supported flow here is:
#   1. Prebuild in a memory-capped throwaway container:
#      docker run --rm --memory=1150m --memory-swap=2300m \
#        -v ~/rizqflow:/app -w /app node:22-alpine \
#        sh -c "npm ci --no-audit --no-fund && NODE_OPTIONS=--max-old-space-size=896 npm run build"
#   2. docker compose -f docker-compose.prod.yml up -d   (this file)
# The repo Dockerfile remains the canonical image build for larger hosts.
services:
  rizqflow:
    image: node:22-alpine
    container_name: rizqflow-web
    working_dir: /app
    command: npm run start
    # .env.server exists ONLY on the host (never in git): it carries
    # DATABASE_URL plus the POSTGRES_* settings for RizqFlow's OWN db
    # service below. RizqFlow's database is a separate Postgres container
    # with its own volume — it does not touch DropRoute's database.
    # Without .env.server the site still serves; only /api/auth/* and
    # /api/me /api/portfolios answer 503.
    env_file:
      - path: .env.server
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - droproute_default
      - rizqflow_net
    mem_limit: 512m
    restart: unless-stopped

  # RizqFlow's own accounts database — separate instance, separate volume,
  # separate credentials from DropRoute's Postgres. Reachable only on the
  # private rizqflow_net network (no published ports).
  db:
    image: postgres:15-alpine
    container_name: rizqflow-db
    command: postgres -c shared_buffers=64MB -c max_connections=20
    env_file:
      - path: .env.server
        required: false
    volumes:
      - rizqflow_pgdata:/var/lib/postgresql/data
    networks:
      - rizqflow_net
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rizqflow -d rizqflow"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  rizqflow_pgdata:

networks:
  droproute_default:
    external: true
  rizqflow_net:
